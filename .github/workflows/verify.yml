name: Verify Munshi Desk

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Start and check the keyless Docker app
        run: |
          docker compose up --build -d
          curl --retry 5 --retry-connrefused --fail --silent http://127.0.0.1:8080/ | grep -F '<title>Munshi Desk'
      - if: always()
        run: docker compose down
