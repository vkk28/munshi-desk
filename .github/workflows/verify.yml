name: Verify Munshi Desk

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start the keyless Docker app
        run: docker compose up --build --wait --wait-timeout 60
      - name: Verify the Docker app and Chrome extension
        run: npm run test:browser
        env:
          MUNSHI_TEST_URL: http://127.0.0.1:8080
      - if: always()
        run: docker compose down
